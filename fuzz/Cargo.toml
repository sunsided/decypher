[package]
name = "decypher-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Its own workspace, so it builds with the nightly sanitizer flags apart from
# the parser's workspace (which also lists it under `exclude`).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.decypher]
path = ".."
# fuzz_parse_roundtrip compares ASTs through their serde representation.
features = ["serde"]

[features]
serde = ["decypher/serde"]
miette = ["decypher/miette"]

[[bin]]
name = "fuzz_parse_cst"
path = "fuzz_targets/fuzz_parse_cst.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_ast"
path = "fuzz_targets/fuzz_parse_ast.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_hir"
path = "fuzz_targets/fuzz_parse_hir.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_roundtrip"
path = "fuzz_targets/fuzz_parse_roundtrip.rs"
test = false
doc = false
bench = false
