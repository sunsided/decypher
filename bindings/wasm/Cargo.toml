[package]
name = "decypher-wasm"
version = "0.2.0-alpha.9"
edition = "2024"
rust-version = "1.94"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
description = "WebAssembly bindings for the decypher Cypher parser."
repository = "https://github.com/sunsided/decypher"
license = "EUPL-1.2 OR MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
decypher = { path = "../..", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
# Binaryen's optimiser shrinks the module noticeably over plain rustc output.
wasm-opt = ["-O3"]
