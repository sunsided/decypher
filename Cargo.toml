[package]
name = "decypher"
version = "0.2.0-alpha.9"
edition = "2024"
rust-version = "1.94"
authors = ["Markus Mayer <widemeadows@gmail.com>", "Austin Poor <code@austinpoor.com>"]
description = "A rust library for parsing openCypher queries."
documentation = "https://docs.rs/decypher"
readme = "README.md"
homepage = "https://github.com/sunsided/decypher"
repository = "https://github.com/sunsided/decypher"
license = "EUPL-1.2 OR MIT OR Apache-2.0"
keywords = ["sql", "cypher", "graph", "parser", "opencypher"]
categories = ["parser-implementations"]
# The vendored openCypher TCK corpus (Apache-2.0, ~5 MB) is test-only.
exclude = ["tests/tck/", "tests/tck.rs", "bindings/"]

[workspace]
members = [".", "bindings/wasm"]
# Plain `cargo` invocations at the root keep targeting the parser crate only;
# the wasm bindings are built through wasm-pack (see bindings/wasm/README.md).
default-members = ["."]
exclude = ["fuzz"]

[dependencies]
thiserror = "2"
serde = { version = "1", optional = true, features = ["derive"] }
ryu = "1"
miette = { version = "7", optional = true }
rowan = "0.17"
unicode-ident = "1"

[features]
default = ["hir"]
hir = []
serde = ["dep:serde"]
miette = ["dep:miette"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "hir_lower"
required-features = ["hir"]

[[test]]
name = "serde"
required-features = ["serde"]

[[example]]
name = "indiana_jones"
required-features = ["hir"]

[dev-dependencies]
assert2 = "0.4"
proptest = "1"
serde_json = "1"
