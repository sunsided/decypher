name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Run rustfmt check
        run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Run tests
        run: cargo test

  no-default-features:
    name: cargo clippy + test (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Run clippy
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Run tests
        run: cargo test --no-default-features

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  wasm:
    name: wasm package (build, test, pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Test the serde feature the bindings rely on
        run: cargo test --features serde --test serde
      - name: Clippy (bindings)
        run: cargo clippy -p decypher-wasm --all-targets -- -D warnings
      - name: Rust unit tests (bindings)
        run: cargo test -p decypher-wasm
      - name: Build npm package
        working-directory: bindings/wasm
        run: node scripts/build.mjs
      - name: Test npm package
        working-directory: bindings/wasm
        run: node --test tests/*.test.mjs
      - name: Run Node.js example
        working-directory: bindings/wasm/examples/node
        run: |
          npm install --no-audit --no-fund
          node lint.js queries/friends.cypher
          # The other sample queries are deliberately broken.
          ! node lint.js queries/broken.cypher queries/typo.cypher
      - name: Pack npm package
        working-directory: bindings/wasm
        run: |
          mkdir -p dist
          npm pack ./pkg --pack-destination dist
      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: bindings/wasm/dist/*.tgz

  dependencies:
    name: Dependency Submission
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-sbom
        uses: psastras/sbom-rs/actions/install-cargo-sbom@cargo-sbom-v0.10.0

      - name: Generate SBOM
        run: cargo-sbom --output-format=spdx_json_2_3 > sbom.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

      - name: Submit dependencies to GitHub
        uses: advanced-security/spdx-dependency-submission-action@v0.2.0
        with:
          filePath: sbom.json
